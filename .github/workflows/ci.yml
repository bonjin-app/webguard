name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm verify
      - run: pnpm format:check
      - run: pnpm test:e2e
      - run: pnpm benchmark
      - run: pnpm benchmark:browser --budget benchmarks/react-vite-budget.json --evidence test-results/rc/browser-performance.json
      - run: pnpm audit --prod
      - run: node scripts/prepare-jsp.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B -f examples/jsp-servlet/pom.xml -Dwebguard.browser=true package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            playwright-report/
            test-results/
            docs/evidence/
          retention-days: 7
  installed-consumers:
    strategy:
      fail-fast: false
      matrix:
        node: ["22.12.0", "22"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >=22.13; bootstrap/build on supported current 22.x.
          node-version: 22
          cache: pnpm
      - name: Provision required native SSR interpreters
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli python3
          python3 --version
          php --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - run: pnpm test:package --isolated-store --evidence test-results/consumers/internal-package.json
      - name: Pack candidate before selecting the consumer runtime
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const [packed] = JSON.parse(execFileSync('npm', ['pack', '--ignore-scripts', '--pack-destination', process.env.RUNNER_TEMP, '--json'], { cwd: 'packages/npm', encoding: 'utf8' }));
          appendFileSync(process.env.GITHUB_ENV, `WEBGUARD_CONSUMER_TARBALL=${join(process.env.RUNNER_TEMP, packed.filename)}\n`);
          NODE
      - name: Select actual package consumer runtime
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/verify-installations.mjs --require-native-runtimes --tarball "$WEBGUARD_CONSUMER_TARBALL"
      - name: Restore supported pnpm runtime for post-job cleanup
        if: always()
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-consumer-evidence-node-${{ matrix.node }}
          path: test-results/consumers/
          retention-days: 7
