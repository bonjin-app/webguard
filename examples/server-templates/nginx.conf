# Static-host recipe; not an executed Nginx fixture.
# Merge into the real server block. Configure TLS separately.
# Keep server templates, original source and policy JSON outside this root.
server {
    listen 8080;
    server_name localhost;
    root /srv/webguard/dist-protected;
    index index.html;

    # Replace with the EXACT generated policy for your application.
    # This example uses Trusted Types report-only for legacy DOM compatibility.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types 'none'" always;
    # Postprocessing retains pre-protection filenames; avoid stale immutable URLs.
    # Prefer release-specific paths for a separately reviewed long-lived cache policy.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ (^|/)\. { return 404; }
    location ~* \.(map|ts|tsx|jsx|vue|svelte)$ { return 404; }
    location ~* (^|/)(webguard-report\.json|webguard-headers\.json|_headers|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|vite\.config\.[^/]+)$ { return 404; }
    location / { try_files $uri $uri/ =404; }
}
